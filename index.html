<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Professor Neurônio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#04040e;
  --mono:'DM Mono',monospace;
  --accent:#6ee7f7;
  --accent2:#a78bfa;
  --ok:#4ade80;
  --text:rgba(255,255,255,.86);
  --muted:rgba(255,255,255,.3);
  --glass:rgba(4,4,14,.68);
  --border:rgba(255,255,255,.07);
  --r:14px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:var(--mono);color:var(--text);-webkit-font-smoothing:antialiased}

canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;z-index:0}

/* ── STATUS — canto superior direito ── */
#status{
  position:fixed;top:clamp(12px,3vw,22px);right:clamp(12px,3vw,22px);
  z-index:20;pointer-events:none;display:flex;align-items:center;gap:7px}
#dot{width:7px;height:7px;border-radius:50%;background:var(--muted);
  transition:background .3s,box-shadow .3s}
#dot.thinking{background:var(--accent2);box-shadow:0 0 10px var(--accent2);animation:blink 1s infinite}
#dot.speaking{background:var(--accent);box-shadow:0 0 14px var(--accent);animation:blink .55s infinite}
#dot.done    {background:var(--ok);box-shadow:0 0 8px var(--ok)}
#dot.error   {background:#f87171;box-shadow:0 0 8px #f87171}
#stxt{font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── LEGENDA frase atual — canto superior esquerdo ── */
#plbl{
  position:fixed;top:clamp(12px,3vw,22px);left:clamp(12px,3vw,22px);
  z-index:20;pointer-events:none;
  max-width:clamp(160px,32vw,320px);
  font-size:10px;line-height:1.65;font-style:italic;
  color:rgba(110,231,247,.45);letter-spacing:.04em;word-break:break-word;
  opacity:0;transition:opacity .3s}
#plbl.show{opacity:1}

/* ── WAVEFORM ── */
#wave{
  position:fixed;
  bottom:clamp(84px,16vh,116px);
  left:50%;transform:translateX(-50%);
  z-index:19;pointer-events:none;
  display:flex;align-items:center;gap:3px;
  opacity:0;transition:opacity .4s}
#wave.on{opacity:1}
#wave span{
  display:block;width:3px;min-height:4px;border-radius:2px;
  transform-origin:bottom center;
  background:var(--accent)}
#wave.thinking span{background:var(--accent2)}
#wave.speaking  span{background:var(--ok)}
@keyframes bar{0%,100%{transform:scaleY(.1)}50%{transform:scaleY(1)}}

/* ── INPUT ── */
#chat{
  position:fixed;
  bottom:clamp(14px,4vh,32px);
  left:50%;transform:translateX(-50%);
  width:min(620px,100% - clamp(16px,4vw,32px)*2);
  z-index:20;pointer-events:all;
  display:flex;flex-direction:column;gap:8px}
#row{display:flex;gap:8px;align-items:flex-end}
textarea{
  flex:1;
  background:var(--glass);
  backdrop-filter:blur(24px) saturate(140%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);font-family:var(--mono);
  font-size:clamp(12px,1.35vw,14px);line-height:1.55;
  padding:12px 15px;resize:none;outline:none;
  min-height:48px;max-height:clamp(80px,18vh,130px);
  overflow-y:auto;
  transition:border-color .2s,box-shadow .2s}
textarea::placeholder{color:var(--muted)}
textarea:focus{border-color:rgba(110,231,247,.22);box-shadow:0 0 0 2px rgba(110,231,247,.05)}
button#send{
  flex-shrink:0;width:48px;height:48px;border:none;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#04040e;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .2s,transform .15s,box-shadow .2s}
button#send:hover{opacity:.85;transform:translateY(-2px);box-shadow:0 0 18px rgba(110,231,247,.3)}
button#send:active{transform:translateY(0)}
button#send:disabled{opacity:.32;cursor:not-allowed;transform:none;box-shadow:none}
button#send svg{width:19px;height:19px;pointer-events:none}
button#stop{
  flex-shrink:0;width:48px;height:48px;border:none;border-radius:50%;
  background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.28);
  color:#f87171;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  transition:opacity .2s,background .2s}
button#stop.on{display:flex}
button#stop:hover{background:rgba(248,113,113,.26)}
button#stop svg{width:18px;height:18px;pointer-events:none}
@media(max-width:480px){button#send,button#stop{width:44px;height:44px}}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="status"><div id="dot"></div><span id="stxt">pronto</span></div>
<div id="plbl"></div>

<div id="wave">
  <span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span>
  <span></span>
</div>

<div id="chat">
  <div id="row">
    <textarea id="q" rows="1" placeholder="Pergunte algo ao Professor Neurônio…  (Ctrl+Enter)"></textarea>
    <button id="stop" aria-label="Parar fala">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
    <button id="send" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls}   from 'three/addons/controls/OrbitControls.js';
import {EffectComposer}  from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass}      from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass}      from 'three/addons/postprocessing/OutputPass.js';

/* ══════ 🔑 URL DO SEU APPS SCRIPT ══════ */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbza0urqWm1mNPy4yRNcir7eYOvMiUC9kDAF3F4lmfh42s6mu85_mFDE9ORyb8VtVY4DKw/exec";

/* ══════ RENDERER ══════ */
const cv=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x04040e);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x04040e,.0022);
const camera=new THREE.PerspectiveCamera(65,1,.1,1000);
camera.position.set(0,6,30);
const ctrl=new OrbitControls(camera,cv);
ctrl.enableDamping=true;ctrl.dampingFactor=.05;ctrl.rotateSpeed=.5;
ctrl.minDistance=8;ctrl.maxDistance=80;
ctrl.autoRotate=true;ctrl.autoRotateSpeed=.18;ctrl.enablePan=false;
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),2.0,.7,.65);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ══════ STARFIELD ══════ */
{
  const N=7000,p=[],col=[],sz=[];
  for(let i=0;i<N;i++){
    const r=THREE.MathUtils.randFloat(55,160);
    const phi=Math.acos(THREE.MathUtils.randFloatSpread(2));
    const th=Math.random()*Math.PI*2;
    p.push(r*Math.sin(phi)*Math.cos(th),r*Math.sin(phi)*Math.sin(th),r*Math.cos(phi));
    const t=Math.random();
    col.push(t<.7?1:.7,t<.7?1:.85,t<.85?1:.8);
    sz.push(THREE.MathUtils.randFloat(.06,.24));
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  g.setAttribute('color',   new THREE.Float32BufferAttribute(col,3));
  g.setAttribute('size',    new THREE.Float32BufferAttribute(sz,1));
  const m=new THREE.ShaderMaterial({
    uniforms:{uT:{value:0}},
    vertexShader:`attribute float size;attribute vec3 color;varying vec3 vC;uniform float uT;
      void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.);
        gl_PointSize=size*(sin(uT*1.8+position.x*80.)*.25+.75)*(280./-mv.z);
        gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vC;
      void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;
        gl_FragColor=vec4(vC,(1.-smoothstep(0.,.5,d))*.72);}`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
  });
  scene.add(new THREE.Points(g,m));
  scene.userData.stars=scene.children[scene.children.length-1];
  scene.userData.smat=m;
}

/* ══════ NOISE GLSL ══════ */
const NOISE=`
vec3 nm3(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 nm4(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 pm(vec4 x){return nm4(((x*34.)+1.)*x);}
vec4 ti(vec4 r){return 1.79284291400159-.85373472095314*r;}
float sn(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;
  vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
  i=nm3(i);
  vec4 p=pm(pm(pm(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);
  vec4 xx=x_*ns.x+ns.yyyy;vec4 yy=y_*ns.x+ns.yyyy;vec4 h=1.-abs(xx)-abs(yy);
  vec4 b0=vec4(xx.xy,yy.xy);vec4 b1=vec4(xx.zw,yy.zw);
  vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=ti(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 mv=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);mv=mv*mv;
  return 42.*dot(mv*mv,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}`;

/* ══════ PALETTES ══════ */
const PAL={
  idle:    [new THREE.Color(0x4facfe),new THREE.Color(0x6ee7f7),new THREE.Color(0x38bdf8),new THREE.Color(0x4484ce),new THREE.Color(0x00f2fe)],
  thinking:[new THREE.Color(0xa78bfa),new THREE.Color(0xc4b5fd),new THREE.Color(0x7c3aed),new THREE.Color(0xf0abfc),new THREE.Color(0xe879f9)],
  answer:  [new THREE.Color(0x4ade80),new THREE.Color(0x6ee7f7),new THREE.Color(0xfacc15),new THREE.Color(0x86efac),new THREE.Color(0x34d399)]
};

/* ══════ NETWORK ══════ */
class Node{
  constructor(pos,lv=0,type=0){
    this.position=pos;this.connections=[];this.level=lv;this.type=type;
    this.size=type===0?THREE.MathUtils.randFloat(.9,1.5):THREE.MathUtils.randFloat(.45,.95);
    this.dist=0;
  }
  connect(n,s=1){
    if(!this.connections.some(c=>c.node===n)){
      this.connections.push({node:n,strength:s});
      n.connections.push({node:this,strength:s});
    }
  }
  has(n){return this.connections.some(c=>c.node===n)}
}
function buildNet(){
  const nodes=[],root=new Node(new THREE.Vector3(0,0,0),0,0);
  root.size=2.2;nodes.push(root);
  const LAYERS=5,GR=(1+Math.sqrt(5))/2;
  for(let ly=1;ly<=LAYERS;ly++){
    const R=ly*4,N=ly*10;
    for(let i=0;i<N;i++){
      const phi=Math.acos(1-2*(i+.5)/N),th=2*Math.PI*i/GR;
      const pos=new THREE.Vector3(R*Math.sin(phi)*Math.cos(th),R*Math.sin(phi)*Math.sin(th),R*Math.cos(phi));
      const n=new Node(pos,ly,(ly===LAYERS||Math.random()<.3)?1:0);
      n.dist=R;nodes.push(n);
      const prev=nodes.filter(x=>x.level===ly-1&&x!==root)
        .sort((a,b)=>pos.distanceTo(a.position)-pos.distanceTo(b.position));
      (ly===1?[root]:prev.slice(0,3)).forEach(t=>{
        n.connect(t,Math.max(.3,1-pos.distanceTo(t.position)/(R*2)));
      });
      nodes.filter(x=>x.level===ly&&x!==n)
        .sort((a,b)=>n.position.distanceTo(a.position)-n.position.distanceTo(b.position))
        .slice(0,4).forEach(nb=>{if(n.position.distanceTo(nb.position)<R*.85)n.connect(nb,.55)});
    }
  }
  nodes.filter(n=>n.level>=3).slice(0,15).forEach(n1=>{
    const c=nodes.filter(n=>n!==n1&&!n1.has(n)&&Math.abs(n.level-n1.level)>1);
    if(c.length)n1.connect(c[Math.floor(Math.random()*Math.min(5,c.length))],.4);
  });
  return{nodes,root};
}

/* ══════ SHADERS ══════ */
const NV=`${NOISE}
attribute float aZ;attribute float aT;attribute vec3 aC;attribute float aD;
uniform float uT;uniform vec3 uPP[3];uniform float uPt[3];uniform float uPS;uniform float uE;
varying vec3 vC;varying float vP;varying float vD;varying float vG;
float pf(vec3 wp,vec3 pp,float pt){if(pt<-100.)return 0.;float dt=uT-pt;if(dt<0.||dt>5.)return 0.;
  return smoothstep(3.,0.,abs(distance(wp,pp)-dt*uPS))*smoothstep(5.,0.,dt);}
void main(){
  vC=aC;vD=aD;
  vec3 wp=(modelMatrix*vec4(position,1.)).xyz;
  float pi=0.;for(int i=0;i<3;i++)pi+=pf(wp,uPP[i],uPt[i]);vP=min(pi,1.);
  float br=sin(uT*.65+aD*.14)*.15+.85;
  float sz=aZ*br*(1.+uE*.55)*(1.+vP*2.1);
  vG=.5+.5*sin(uT*.4+aD*.18);
  vec3 mp=position;if(aT>.5)mp+=normal*sn(position*.07+uT*.07)*.11;
  vec4 mv=modelViewMatrix*vec4(mp,1.);
  gl_PointSize=sz*.5*(1000./-mv.z);gl_Position=projectionMatrix*mv;}`;
const NF=`
uniform float uT;uniform vec3 uPC[3];uniform float uE;
varying vec3 vC;varying float vP;varying float vD;varying float vG;
void main(){
  vec2 c=2.*gl_PointCoord-1.;float d=length(c);if(d>1.)discard;
  float g1=1.-smoothstep(0.,.5,d),g2=1.-smoothstep(0.,1.,d);
  float gs=pow(g1,1.15)+g2*.28;
  vec3 col=vC*(.88+.12*sin(uT*.55+vD*.22));
  if(vP>0.){col=mix(col,mix(vec3(1.),uPC[0],.35),vP*.85);col*=1.+vP*1.1;gs*=1.+vP;}
  col+=vec3(1.)*smoothstep(.4,0.,d)*.28;col*=1.+vG*.08+uE*.14;
  gl_FragColor=vec4(col,gs*(.92-.28*d));}`;
const CV=`${NOISE}
attribute vec3 aS;attribute vec3 aE;attribute float aStr;attribute float aI;attribute vec3 aC;
uniform float uT;uniform vec3 uPP[3];uniform float uPt[3];uniform float uPS;uniform float uE;
varying vec3 vC;varying float vStr;varying float vP;varying float vTt;varying float vCD;
float pf(vec3 wp,vec3 pp,float pt){if(pt<-100.)return 0.;float dt=uT-pt;if(dt<0.||dt>5.)return 0.;
  return smoothstep(3.,0.,abs(distance(wp,pp)-dt*uPS))*smoothstep(5.,0.,dt);}
void main(){
  float t=position.x;vTt=t;
  vec3 mid=mix(aS,aE,.5);
  vec3 perp=normalize(cross(normalize(aE-aS),vec3(0.,1.,0.)));
  if(length(perp)<.05)perp=vec3(1.,0.,0.);
  mid+=perp*sin(t*3.14159)*.13;
  vec3 fp=mix(mix(aS,mid,t),mix(mid,aE,t),t);
  fp+=perp*sn(vec3(aI*.09,t*.55,uT*.12))*.09;
  vec3 wp=(modelMatrix*vec4(fp,1.)).xyz;
  float pi=0.;for(int i=0;i<3;i++)pi+=pf(wp,uPP[i],uPt[i]);vP=min(pi,1.);
  vC=aC;vStr=aStr;vCD=length(wp-cameraPosition);
  gl_Position=projectionMatrix*modelViewMatrix*vec4(fp,1.);}`;
const CF=`
uniform float uT;uniform vec3 uPC[3];uniform float uE;
varying vec3 vC;varying float vStr;varying float vP;varying float vTt;varying float vCD;
void main(){
  float f=(sin(vTt*22.-uT*4.2)*.5+.5+sin(vTt*13.-uT*2.6+1.57)*.5+.5)*.5;
  vec3 col=vC*(.78+.22*sin(uT*.55+vTt*10.));
  float fi=.36*f*vStr;
  if(vP>0.){col=mix(col,mix(vec3(1.),uPC[0],.28),vP*.65);fi+=vP*.72;}
  col*=.62+fi+vStr*.42+uE*.18;
  float a=(.66*vStr+f*.26)*smoothstep(100.,12.,vCD);
  a=mix(a,min(1.,a*2.1),vP);gl_FragColor=vec4(col,a);}`;

/* ══════ MESH BUILD ══════ */
function mkU(){
  return{
    uT:{value:0},
    uPP:{value:[new THREE.Vector3(1e4,1e4,1e4),new THREE.Vector3(1e4,1e4,1e4),new THREE.Vector3(1e4,1e4,1e4)]},
    uPt:{value:[-1e4,-1e4,-1e4]},
    uPC:{value:[new THREE.Color(1,1,1),new THREE.Color(1,1,1),new THREE.Color(1,1,1)]},
    uPS:{value:18},uE:{value:0}
  };
}
let NM=null,CM=null,NET=null;
function buildMeshes(pal){
  if(NM){scene.remove(NM);NM.geometry.dispose();NM.material.dispose()}
  if(CM){scene.remove(CM);CM.geometry.dispose();CM.material.dispose()}
  NET=buildNet();const{nodes}=NET,U=mkU();
  const np=[],nt=[],ns=[],nc=[],nd=[];
  nodes.forEach(n=>{
    np.push(n.position.x,n.position.y,n.position.z);
    nt.push(n.type);ns.push(n.size);nd.push(n.dist);
    const c=pal[Math.min(n.level,pal.length-1)].clone()
      .offsetHSL(THREE.MathUtils.randFloatSpread(.03),THREE.MathUtils.randFloatSpread(.08),THREE.MathUtils.randFloatSpread(.08));
    nc.push(c.r,c.g,c.b);
  });
  const ng=new THREE.BufferGeometry();
  ng.setAttribute('position',new THREE.Float32BufferAttribute(np,3));
  ng.setAttribute('aT',new THREE.Float32BufferAttribute(nt,1));
  ng.setAttribute('aZ',new THREE.Float32BufferAttribute(ns,1));
  ng.setAttribute('aC',new THREE.Float32BufferAttribute(nc,3));
  ng.setAttribute('aD',new THREE.Float32BufferAttribute(nd,1));
  NM=new THREE.Points(ng,new THREE.ShaderMaterial({
    uniforms:THREE.UniformsUtils.clone(U),
    vertexShader:NV,fragmentShader:NF,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
  }));
  scene.add(NM);NM.userData.u=NM.material.uniforms;
  const cp=[],cs=[],ce=[],cst=[],ci=[],cc=[];
  const seen=new Set();let idx=0;const SEG=20;
  nodes.forEach((n,ni)=>{
    n.connections.forEach(({node:m,strength})=>{
      const mi=nodes.indexOf(m);if(mi<0)return;
      const key=[Math.min(ni,mi),Math.max(ni,mi)].join('-');
      if(seen.has(key))return;seen.add(key);
      for(let s=0;s<SEG;s++){
        const t=s/(SEG-1);
        cp.push(t,0,0);
        cs.push(n.position.x,n.position.y,n.position.z);
        ce.push(m.position.x,m.position.y,m.position.z);
        cst.push(strength);ci.push(idx);
        const lv=Math.min(Math.floor((n.level+m.level)/2),pal.length-1);
        const c=pal[lv].clone()
          .offsetHSL(THREE.MathUtils.randFloatSpread(.03),THREE.MathUtils.randFloatSpread(.08),THREE.MathUtils.randFloatSpread(.08));
        cc.push(c.r,c.g,c.b);
      }
      idx++;
    });
  });
  const cg=new THREE.BufferGeometry();
  cg.setAttribute('position',new THREE.Float32BufferAttribute(cp,3));
  cg.setAttribute('aS',  new THREE.Float32BufferAttribute(cs,3));
  cg.setAttribute('aE',  new THREE.Float32BufferAttribute(ce,3));
  cg.setAttribute('aStr',new THREE.Float32BufferAttribute(cst,1));
  cg.setAttribute('aI',  new THREE.Float32BufferAttribute(ci,1));
  cg.setAttribute('aC',  new THREE.Float32BufferAttribute(cc,3));
  CM=new THREE.LineSegments(cg,new THREE.ShaderMaterial({
    uniforms:THREE.UniformsUtils.clone(U),
    vertexShader:CV,fragmentShader:CF,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
  }));
  scene.add(CM);CM.userData.u=CM.material.uniforms;
  pal.slice(0,3).forEach((c,i)=>{NM.userData.u.uPC.value[i].copy(c);CM.userData.u.uPC.value[i].copy(c)});
}

/* ══════ PALETTE ══════ */
let actPal='idle';
function setPal(key,energy=0){
  if(!NM||!CM)return;
  actPal=key;const pal=PAL[key];
  [NM,CM].forEach(m=>{
    m.userData.u.uE.value=energy;
    pal.slice(0,3).forEach((c,i)=>m.userData.u.uPC.value[i].copy(c));
  });
  const ca=NM.geometry.attributes.aC;
  NET.nodes.forEach((n,i)=>{
    const c=pal[Math.min(n.level,pal.length-1)].clone()
      .offsetHSL(THREE.MathUtils.randFloatSpread(.025),THREE.MathUtils.randFloatSpread(.06),THREE.MathUtils.randFloatSpread(.06));
    ca.setXYZ(i,c.r,c.g,c.b);
  });
  ca.needsUpdate=true;
}

/* ══════ PULSO VISUAL (disparo único) ══════ */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
const ip=new THREE.Plane(),ipt=new THREE.Vector3();
let pidx=0;
const clock=new THREE.Clock();

function fire(x,y,col){
  ptr.x=(x/innerWidth)*2-1;ptr.y=-(y/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  ip.normal.copy(camera.position).normalize();
  ip.constant=-ip.normal.dot(camera.position)+camera.position.length()*.5;
  if(!ray.ray.intersectPlane(ip,ipt))return;
  const t=clock.getElapsedTime(),i=pidx++%3;
  const c=col||PAL[actPal][Math.floor(Math.random()*PAL[actPal].length)];
  [NM,CM].forEach(m=>{if(!m)return;
    m.userData.u.uPP.value[i].copy(ipt);
    m.userData.u.uPt.value[i]=t;
    m.userData.u.uPC.value[i].copy(c);
  });
}

/* ══════ PULSO CONTÍNUO DURANTE FALA ══════
   Dispara pulsos aleatórios pela rede enquanto a IA está falando,
   simulando sinapses ativas — intervalo curto e irregular.
══════ */
let neuralInterval=null;
function startNeuralFire(mode){
  stopNeuralFire();
  const pal=PAL[mode==='answer'?'answer':'thinking'];
  function burst(){
    if(!neuralInterval)return;
    const n=1+Math.floor(Math.random()*3); // 1-3 pulsos por burst
    for(let i=0;i<n;i++){
      const x=innerWidth*(0.05+Math.random()*0.9);
      const y=innerHeight*(0.05+Math.random()*0.9);
      fire(x,y,pal[Math.floor(Math.random()*pal.length)]);
    }
    // Próximo burst em 300-900ms (irregular, como sinapses)
    neuralInterval=setTimeout(burst,300+Math.random()*600);
  }
  neuralInterval=setTimeout(burst,80);
}
function stopNeuralFire(){
  if(neuralInterval){clearTimeout(neuralInterval);neuralInterval=null;}
}

cv.addEventListener('click',e=>{if(!e.target.closest('#chat'))fire(e.clientX,e.clientY)});
cv.addEventListener('touchend',e=>{
  if(e.target.closest('#chat'))return;
  e.preventDefault();
  const t=e.changedTouches[0];fire(t.clientX,t.clientY);
},{passive:false});

/* ══════ WAVEFORM ══════ */
const waveEl=document.getElementById('wave');
const bars=[...waveEl.querySelectorAll('span')];
function startWave(mode){
  waveEl.className='on '+mode;
  bars.forEach((b,i)=>{
    const dur=(0.35+Math.random()*.55).toFixed(2);
    const delay=(i*0.048).toFixed(2);
    b.style.height=Math.round(10+Math.random()*26)+'px';
    b.style.animation=`bar ${dur}s ${delay}s ease-in-out infinite`;
  });
}
function stopWave(){
  waveEl.className='';
  bars.forEach(b=>{b.style.animation='none';b.style.height='4px';});
}

/* ══════ LIMPEZA DE TEXTO (segurança no browser) ══════ */
function cleanText(txt){
  if(!txt)return'';
  // Remove tags HTML
  txt=txt.replace(/<[^>]*>/g,'');
  // Entidades HTML
  txt=txt.replace(/&lt;/g,'').replace(/&gt;/g,'').replace(/&amp;/g,'e')
         .replace(/&nbsp;/g,' ').replace(/&[a-zA-Z]+;/g,'');
  // Markdown: **, __, *, _, `, ##, ~~
  txt=txt.replace(/\*\*([^*]+)\*\*/g,'$1').replace(/__([^_]+)__/g,'$1')
         .replace(/\*([^*]+)\*/g,'$1').replace(/_([^_]+)_/g,'$1')
         .replace(/`([^`]+)`/g,'$1').replace(/~~([^~]+)~~/g,'$1')
         .replace(/#{1,6}\s*/g,'');
  // Símbolos < > soltos
  txt=txt.replace(/[<>]/g,'');
  // URLs
  txt=txt.replace(/https?:\/\/\S+/g,'');
  // Múltiplos espaços
  txt=txt.replace(/[ \t]{2,}/g,' ');
  return txt.trim();
}

/* ══════ WEB SPEECH TTS ══════ */
const synth=window.speechSynthesis;
let ttsVoice=null;
function loadVoices(){
  const all=synth.getVoices();
  ttsVoice=all.find(v=>v.lang==='pt-BR')
           ||all.find(v=>v.lang.startsWith('pt'))
           ||all[0]||null;
}
loadVoices();
if('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged=loadVoices;

function speak(text,mode,onEnd){
  const clean=cleanText(text);
  if(!clean){onEnd&&onEnd();return;}
  synth.cancel();
  const utt=new SpeechSynthesisUtterance(clean);
  if(ttsVoice)utt.voice=ttsVoice;
  utt.lang='pt-BR';
  if(mode==='thinking'){
    utt.rate=0.87;utt.pitch=0.90;utt.volume=0.70;
  }else{
    utt.rate=1.02;utt.pitch=1.06;utt.volume=1.00;
  }
  utt.onstart=()=>{
    startWave(mode);
    startNeuralFire(mode); // ← inicia pulsos neurais contínuos
  };
  utt.onend=()=>{
    stopWave();
    stopNeuralFire();      // ← para pulsos ao terminar
    onEnd&&onEnd();
  };
  utt.onerror=()=>{
    stopWave();
    stopNeuralFire();
    onEnd&&onEnd();
  };
  synth.speak(utt);
}

/* ══════ FILA DE FALA ══════ */
const plbl=document.getElementById('plbl');
let spkQueue=[],spkIdx=0,spkActive=false,currentTok=null;

function runQueue(q,tok){
  synth.cancel();
  stopNeuralFire();
  spkQueue=q;spkIdx=0;spkActive=true;currentTok=tok;
  nextItem();
}

function nextItem(){
  if(!spkActive||spkIdx>=spkQueue.length){finishAll();return;}
  const item=spkQueue[spkIdx++];

  // Sentinela: troca paleta sem falar
  if(item.type==='__switch__'){
    setPal('answer',.45);
    setSt('speaking','respondendo…');
    setTimeout(nextItem,200);
    return;
  }

  const mode=item.type==='answer'?'answer':'thinking';

  // Legenda (primeiras 9 palavras)
  const words=item.text.split(' ');
  plbl.textContent=words.slice(0,9).join(' ')+(words.length>9?'…':'');
  plbl.classList.add('show');

  speak(item.text,mode,()=>{
    plbl.classList.remove('show');
    setTimeout(nextItem,mode==='thinking'?130:220);
  });
}

function finishAll(){
  spkActive=false;
  stopWave();
  stopNeuralFire();
  plbl.classList.remove('show');
  setPal('idle',0);
  setSt('done',(currentTok||'?')+' tokens');
  stopBtn.classList.remove('on');
}

function stopAll(){
  spkActive=false;
  synth.cancel();
  stopWave();
  stopNeuralFire();
  plbl.classList.remove('show');
  setPal('idle',0);
  setSt('','pronto');
  stopBtn.classList.remove('on');
}

/* ══════ RESIZE + LOOP ══════ */
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);composer.setSize(w,h);
  bloom.resolution.set(w,h);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
resize();window.addEventListener('resize',resize);
(function loop(){
  requestAnimationFrame(loop);
  const t=clock.getElapsedTime();
  const{stars,smat}=scene.userData;
  if(stars){stars.rotation.y+=.00018;smat.uniforms.uT.value=t;}
  [NM,CM].forEach(m=>{if(!m)return;m.userData.u.uT.value=t;m.rotation.y=Math.sin(t*.038)*.045;});
  ctrl.update();composer.render();
})();
buildMeshes(PAL.idle);

/* ══════ UI REFS ══════ */
const dot    =document.getElementById('dot');
const stxt   =document.getElementById('stxt');
const qEl    =document.getElementById('q');
const sendBtn=document.getElementById('send');
const stopBtn=document.getElementById('stop');
function setSt(cls,msg){dot.className=cls||'';stxt.textContent=msg;}

/* ══════ CHAMADA AO APPS SCRIPT ══════ */
async function ask(msg){
  const r=await fetch(APPS_SCRIPT_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({message:msg})
  });
  if(!r.ok)throw new Error('Proxy '+r.status);
  const d=await r.json();
  if(d.error)throw new Error(d.error);

  const thinking=cleanText((d.thinking||'').trim());
  const answer  =cleanText((d.answer  ||'').trim());
  let pulses=Array.isArray(d.pulses)?d.pulses:[];

  // Limpa texto de cada pulso também
  pulses=pulses.map(p=>({...p,text:cleanText(p.text)}))
               .filter(p=>p.text.length>3);

  // Fallback: constrói pulsos de raciocínio no browser se não vieram
  if(!pulses.some(p=>p.type==='thinking')&&thinking){
    const sents=thinking.split(/[.!?]+\s+/).map(s=>s.trim()).filter(s=>s.length>8);
    for(let i=0;i<sents.length;i+=3)
      pulses.push({type:'thinking',text:sents.slice(i,i+3).join(' ')});
  }
  if(answer&&!pulses.some(p=>p.type==='answer'))
    pulses.push({type:'answer',text:answer});

  return{thinking,answer,pulses,tok:d.usage?.total_tokens};
}

/* ══════ ENVIAR ══════ */
async function send(){
  const q=qEl.value.trim();if(!q)return;
  stopAll();
  sendBtn.disabled=true;
  setSt('thinking','pensando…');
  setPal('thinking',1);

  // Pulsos neurais imediatos enquanto espera a API
  startNeuralFire('thinking');

  try{
    const{pulses,tok}=await ask(q);
    stopNeuralFire(); // para os pulsos de espera

    if(!pulses.length){
      setSt('error','sem resposta');
      setPal('idle',0);
      return;
    }

    const queue=[];
    pulses.filter(p=>p.type==='thinking').forEach(p=>queue.push(p));
    if(pulses.some(p=>p.type==='answer')){
      queue.push({type:'__switch__',text:''});
      pulses.filter(p=>p.type==='answer').forEach(p=>queue.push(p));
    }

    setSt('thinking','raciocínando…');
    stopBtn.classList.add('on');
    runQueue(queue,tok);

  }catch(e){
    stopNeuralFire();
    setSt('error',e.message.slice(0,55));
    setPal('idle',0);
  }finally{
    sendBtn.disabled=false;
  }
}

sendBtn.addEventListener('click',send);
stopBtn.addEventListener('click',stopAll);
qEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send();}
});
qEl.addEventListener('input',()=>{
  qEl.style.height='auto';
  qEl.style.height=Math.min(qEl.scrollHeight,130)+'px';
});
</script>
